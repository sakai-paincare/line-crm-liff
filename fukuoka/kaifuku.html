<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>経過フォロー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f0f4f5; min-height: 100vh; padding: 16px;
    }
    .panel {
      background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 24px 20px; width: 100%; max-width: 440px; margin: 0 auto;
    }
    h1 { font-size: 18px; color: #E44888; margin-bottom: 6px; }
    .lead { font-size: 13px; color: #667; line-height: 1.7; margin-bottom: 16px; }
    .q { font-size: 15px; font-weight: 700; color: #334; margin: 18px 0 8px; line-height: 1.6; }
    .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .scale button {
      margin: 0; padding: 12px 0; border: 1px solid #ccd; border-radius: 10px; background: #fff;
      color: #334; font-size: 16px; font-weight: 700;
    }
    .scale button.on { background: #E44888; color: #fff; border-color: #E44888; }
    .scale .worse { grid-column: span 6; margin-top: 4px; font-size: 14px; }
    .scale .worse.on { background: #b03a2e; border-color: #b03a2e; }
    .legend { display: flex; justify-content: space-between; font-size: 11px; color: #889; margin-top: 4px; }
    .radio { display: flex; gap: 14px; margin: 6px 0; font-size: 14px; }
    .radio label { display: flex; align-items: center; gap: 6px; }
    textarea {
      width: 100%; padding: 10px; border: 1px solid #ccd; border-radius: 10px;
      font-size: 16px; font-family: inherit; min-height: 96px; margin-top: 8px;
    }
    button.submit {
      width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 12px;
      background: #E44888; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .message { font-size: 15px; line-height: 1.8; color: #334; text-align: center; padding: 24px 0; }
    .error { color: #b00020; font-size: 14px; line-height: 1.7; white-space: pre-line; }
    .hint { font-size: 11px; color: #889; margin-top: 12px; line-height: 1.6; }
    .meta {
      display: inline-block; background: #FCE8F1; color: #E44888;
      font-size: 12px; font-weight: 700; border-radius: 999px;
      padding: 4px 12px; margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div id="loading" class="message">読み込み中…</div>

    <div id="form" hidden>
      <div class="meta">2つの質問・約30秒</div>
      <h1>経過をお聞かせください</h1>
      <p class="lead">治療後の経過を確認させていただきます。ボタンを選んで送信するだけです。</p>

      <div class="q">Q1. 初回の治療前の痛みを10とすると、ここ数日の痛みはどれくらいですか？</div>
      <div class="scale" id="scale"></div>
      <div class="legend"><span>0 = 痛みなし</span><span>10 = 治療前と同じ</span></div>

      <div class="q">Q2. 次回の診察で医師に伝えておきたいことはありますか？</div>
      <div class="radio">
        <label><input type="radio" name="hasnote" value="no" checked> 特にありません</label>
        <label><input type="radio" name="hasnote" value="yes"> あります</label>
      </div>
      <div id="notebox" hidden>
        <textarea id="f-note" placeholder="まだ肩の痛みが残っている／追加治療をした方がいいか聞きたい／気をつけることを知りたい"></textarea>
      </div>
      <p class="hint">いただいた内容は診察時に医師が確認します。お急ぎのご相談は『無料相談・お問い合わせ』からお願いします。</p>

      <button class="submit" id="submit" disabled>送信する</button>
    </div>

    <div id="done" class="message" hidden>
      ✅ ありがとうございました。<br>
      経過を受け付けました。<br>
      次回の診察時に医師が確認いたします。
    </div>

    <div id="error" class="error" hidden></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ============================================================
    // 設定 — 福岡ペインケアクリニック本番版(GitHub Pages配信のためHTMLに直接記載)
    // ============================================================
    // ⚠ Loginチャネル「会員証」(2010587487)に kaifuku 用LIFFを新規作成し、
    //   エンドポイントURLをこのページ(…/fukuoka/kaifuku.html)にしてから LIFF_ID を記入すること。
    //   あわせてGAS側 Script Property KAIFUKU_LIFF_URL に https://liff.line.me/<LIFF_ID> を設定する
    //   (配信ボタン kind:'kaifuku' が ?c=<配信ID>&t=<タイミング> を付けて開く)。
    var LIFF_ID = 'SET_ME';
    // 福岡本番GASウェブアプリの /exec URL(consult.htmlと同じ)
    var API_URL = 'https://script.google.com/macros/s/AKfycbx56mHvPH4TgoasxPWLFqHAbhcOsSAJIj29cb2_o0cRqndksCuRifXX2KbYSGPhSwVt/exec';

    var userId = '';
    var nrs = null; // 0〜10、11=治療前より強い

    function query(name) {
      var q = new URLSearchParams(location.search);
      var v = q.get(name);
      if (v === null && q.get('liff.state')) {
        v = new URLSearchParams(decodeURIComponent(q.get('liff.state')).replace(/^\?/, '')).get(name);
      }
      return v || '';
    }
    var timing = query('t');
    var campaign = query('c');

    // Q1 のボタン(0〜10 + 治療前より強い)
    (function buildScale() {
      var el = document.getElementById('scale');
      for (var i = 0; i <= 10; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = i; b.dataset.v = i;
        el.appendChild(b);
      }
      var w = document.createElement('button');
      w.type = 'button'; w.className = 'worse'; w.textContent = '治療前より強い'; w.dataset.v = 11;
      el.appendChild(w);
      el.addEventListener('click', function (e) {
        var t = e.target.closest('button'); if (!t) return;
        nrs = Number(t.dataset.v);
        Array.prototype.forEach.call(el.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === t); });
        document.getElementById('submit').disabled = false;
      });
    })();

    Array.prototype.forEach.call(document.querySelectorAll('input[name=hasnote]'), function (r) {
      r.addEventListener('change', function () {
        var yes = document.querySelector('input[name=hasnote]:checked').value === 'yes';
        document.getElementById('notebox').hidden = !yes;
        if (yes) document.getElementById('f-note').focus();
      });
    });

    function show(id) {
      ['loading', 'form', 'done', 'error'].forEach(function (x) {
        document.getElementById(x).hidden = (x !== id);
      });
    }
    function fail(message) {
      document.getElementById('error').textContent =
        message + '\nお手数ですがトーク画面から「無料相談・お問い合わせ」をご利用ください。';
      show('error');
    }

    if (LIFF_ID === 'SET_ME') {
      fail('フォームの準備中です(LIFF未設定)。');
    } else {
      liff.init({ liffId: LIFF_ID }).then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return; }
        return liff.getProfile();
      }).then(function (profile) {
        if (!profile) return;
        userId = profile.userId;
        show('form');
      }).catch(function (err) {
        fail('フォームを開けませんでした(' + (err && err.message ? err.message : err) + ')。');
      });
    }

    document.getElementById('submit').onclick = function () {
      if (nrs === null) { alert('Q1 の痛みの程度を選んでください'); return; }
      var hasNote = document.querySelector('input[name=hasnote]:checked').value === 'yes';
      var note = hasNote ? document.getElementById('f-note').value.trim() : '';
      if (hasNote && !note) { alert('医師に伝えたいことをご記入ください(なければ「特にありません」を選んでください)'); return; }
      var btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = '送信中…';
      // GASのdoPostへ直接送信(Content-Type: text/plain でプリフライトを回避)。受付pushは送らない
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'kaifuku_submit',
          uid: userId,
          nrs: nrs,
          has_note: hasNote,
          note: note,
          timing: timing,
          campaign: campaign,
        }),
      }).then(function (res) { return res.json(); }).then(function (data) {
        if (data && data.ok) {
          show('done');
          if (liff.isInClient && liff.isInClient()) {
            setTimeout(function () { liff.closeWindow(); }, 3000);
          }
        } else {
          throw new Error((data && data.error) || '受付できませんでした');
        }
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = '送信する';
        fail('送信に失敗しました(' + (err && err.message ? err.message : err) + ')。');
      });
    };
  </script>
</body>
</html>
