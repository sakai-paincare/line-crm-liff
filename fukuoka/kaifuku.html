<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>経過フォロー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f0f4f5; min-height: 100vh; padding: 16px;
      -webkit-text-size-adjust: 100%;
    }
    .panel {
      background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 24px 20px; width: 100%; max-width: 480px; margin: 0 auto;
    }
    body.clinic .panel { max-width: 640px; padding: 32px 28px; }
    h1 { font-size: 18px; color: #E44888; margin-bottom: 6px; }
    .lead { font-size: 13px; color: #667; line-height: 1.7; margin-bottom: 16px; }
    body.clinic .lead, body.clinic .q, body.clinic .opt, body.clinic .scale button { font-size: 1.1em; }
    .intro { background: #FCE8F1; color: #8a2d58; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.7; margin-bottom: 14px; }
    .progress { font-size: 12px; color: #889; margin-bottom: 8px; }
    .q { font-size: 15px; font-weight: 700; color: #334; margin: 12px 0 10px; line-height: 1.6; }
    .sub { font-size: 13px; color: #667; line-height: 1.7; margin: -4px 0 10px; }
    .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .scale button {
      margin: 0; padding: 12px 0; border: 1px solid #ccd; border-radius: 10px; background: #fff;
      color: #334; font-size: 16px; font-weight: 700;
    }
    .scale button.on { background: #E44888; color: #fff; border-color: #E44888; }
    .scale .worse { grid-column: span 6; margin-top: 4px; font-size: 14px; }
    .scale .worse.on { background: #b03a2e; border-color: #b03a2e; }
    .scale.days { grid-template-columns: repeat(8, 1fr); }
    .legend { display: flex; justify-content: space-between; font-size: 11px; color: #889; margin-top: 4px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid #ccd; border-radius: 12px;
      background: #fff; font-size: 15px; color: #334; text-align: left; width: 100%;
    }
    .opt.on { background: #FCE8F1; border-color: #E44888; color: #8a2d58; font-weight: 700; }
    .opt .mark { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ccd; flex: none; }
    .opt.multi .mark { border-radius: 5px; }
    .opt.on .mark { background: #E44888; border-color: #E44888; }
    .opt.ep { flex-direction: column; align-items: flex-start; gap: 2px; }
    .opt.ep .d { font-size: 12px; color: #889; }
    .opt.on.ep .d { color: #8a2d58; }
    .group { margin-bottom: 14px; }
    .group .gq { font-size: 14px; font-weight: 700; color: #334; margin-bottom: 6px; }
    .group .opts { flex-direction: row; flex-wrap: wrap; }
    .group .opt { width: auto; padding: 8px 12px; font-size: 14px; }
    textarea, input[type=text] {
      width: 100%; padding: 10px; border: 1px solid #ccd; border-radius: 10px;
      font-size: 16px; font-family: inherit; margin-top: 8px;
    }
    textarea { min-height: 96px; }
    .nav { display: flex; gap: 10px; margin-top: 20px; }
    button.primary {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      background: #E44888; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button.ghost { padding: 14px 16px; border: 1px solid #ccd; border-radius: 12px; background: #fff; color: #667; font-size: 14px; }
    button:disabled { opacity: .5; }
    .message { font-size: 15px; line-height: 1.8; color: #334; text-align: center; padding: 24px 0; }
    .message.big { font-size: 20px; padding: 48px 0; }
    .error { color: #b00020; font-size: 14px; line-height: 1.7; white-space: pre-line; }
    .hint { font-size: 11px; color: #889; margin-top: 12px; line-height: 1.6; }
    .meta {
      display: inline-block; background: #FCE8F1; color: #E44888;
      font-size: 12px; font-weight: 700; border-radius: 999px;
      padding: 4px 12px; margin-bottom: 8px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="loading" class="message">読み込み中…</div>
    <div id="screen" hidden></div>
    <div id="error" class="error" hidden></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ============================================================
    // 設定 — 福岡ペインケアクリニック本番版(GitHub Pages配信のためHTMLに直接記載)
    // ============================================================
    // Loginチャネル「会員証」(2010587487)の福岡本番 kaifuku 用LIFF(scope: openid)
    var LIFF_ID = '2010587487-oHxUEwrd';
    // 福岡本番GASウェブアプリの /exec URL(consult.htmlと同じ)
    var API_URL = 'https://script.google.com/macros/s/AKfycbx56mHvPH4TgoasxPWLFqHAbhcOsSAJIj29cb2_o0cRqndksCuRifXX2KbYSGPhSwVt/exec';
    var FORM_VERSION = 2;
    // API契約: line-crm/docs/kaifuku-followup.md §3(kaifuku_init / kaifuku_submit)

    // ============================================================
    // 起動パラメータ
    //   LINEモード(既定): LIFFで userId + IDトークンを取得して送る
    //   院内モード(?mode=clinic&t=<token>): LIFFを初期化せず token だけで動く(iPad・ガイデッドアクセス想定)
    // ============================================================
    function query(name) {
      var q = new URLSearchParams(location.search);
      var v = q.get(name);
      if (v === null && q.get('liff.state')) {
        v = new URLSearchParams(decodeURIComponent(q.get('liff.state')).replace(/^\?/, '')).get(name);
      }
      return v || '';
    }
    var MODE = query('mode') === 'clinic' ? 'clinic' : 'line';
    var TOKEN = query('t');           // 院内モード: FormTokens のトークン
    var timing = MODE === 'line' ? query('t') : '';   // LINEモード: 配信のタイミングキー(?t=2w 等。従来どおり)
    var campaign = query('c');
    if (MODE === 'clinic') document.body.className = 'clinic';

    var userId = '';
    var idToken = '';
    var INIT = null;      // kaifuku_init の data
    var EP = null;        // 選択中のエピソード
    var A = { nrs: null, pgic: null, analgesic: null, added: [], addedOther: '', ae: [], aeOther: '',
              aeDetail: { onset: '', days: '', visited: '', treated: '', admitted: '' }, hasNote: null, note: '' };

    var $screen = document.getElementById('screen');
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function show(id) {
      ['loading', 'screen', 'error'].forEach(function (x) { document.getElementById(x).hidden = (x !== id); });
      window.scrollTo(0, 0);
    }
    function fail(message) {
      var tail = MODE === 'clinic' ? '\nお手数ですが受付スタッフにお声がけください。' : '\nお手数ですがトーク画面から「無料相談・お問い合わせ」をご利用ください。';
      document.getElementById('error').textContent = message + tail;
      show('error');
    }
    function render(html) {
      // 画面ごとにコンテナを差し替えて、前の画面が付けたイベントリスナーを捨てる
      var n = $screen.cloneNode(false); n.innerHTML = html;
      $screen.parentNode.replaceChild(n, $screen); $screen = n;
      show('screen');
    }

    // ---- API ----
    function identity() {
      var o = { mode: MODE };
      if (MODE === 'clinic') { o.token = TOKEN; }
      else { o.uid = userId; if (idToken) o.id_token = idToken; }
      return o;
    }
    function callApi(body) {
      Object.keys(identity()).forEach(function (k) { body[k] = identity()[k]; });
      // GASのdoPostへ直接送信(Content-Type: text/plain でプリフライトを回避)
      return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
        .then(function (res) { return res.text(); })
        .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('応答を読み取れませんでした'); } });
    }

    // ---- 起動 ----
    function boot() {
      callApi({ action: 'kaifuku_init' }).then(function (r) {
        if (!r || !r.ok) { throw Object.assign(new Error((r && r.error) || '読み込めませんでした'), { code: r && r.code }); }
        INIT = r.data;
        if (INIT.all_answered) { return renderAnswered(); }
        if (INIT.short_form) { EP = null; return renderStep('q1'); } // 旧2問版と同じ Q1(汎用ラベル)+Q6
        var open = INIT.episodes.filter(function (e) { return !e.answered_at; });
        if (open.length === 1) { EP = open[0]; return renderStep('q1'); }
        renderSelect(open);
      }).catch(function (err) { fail((err && err.message) || String(err)); });
    }

    if (MODE === 'clinic') {
      if (!TOKEN) { fail('このQRコードは無効です。'); }
      else { boot(); }
    } else if (LIFF_ID === 'SET_ME') {
      fail('フォームの準備中です(LIFF未設定)。');
    } else {
      liff.init({ liffId: LIFF_ID }).then(function () {
        if (!liff.isLoggedIn()) { liff.login(); return null; }
        return liff.getProfile();
      }).then(function (profile) {
        if (!profile) return;
        userId = profile.userId;
        // IDトークン(GAS側 KAIFUKU_VERIFY_MODE=log/enforce で検証)。取得できなくても送信は止めず uid だけで送る(移行中は log モード前提)
        try { idToken = liff.getIDToken() || ''; } catch (e) { idToken = ''; }
        boot();
      }).catch(function (err) {
        fail('フォームを開けませんでした(' + (err && err.message ? err.message : err) + ')。');
      });
    }

    // ---- 画面 ----
    function renderAnswered() {
      render('<div class="message big">ご回答済みです。<br>ありがとうございます。</div>' +
        (MODE === 'clinic' ? '<div class="message">受付にiPadをお返しください。</div>' : ''));
      closeIfLine();
    }

    function renderSelect(list) {
      var html = '<div class="meta">経過フォロー</div><h1>どの治療についてお答えいただけますか？</h1>' +
        '<p class="lead">治療ごとに順番にお聞きします。まず1つ選んでください。</p><div class="opts">';
      list.forEach(function (e, i) {
        html += '<button type="button" class="opt ep" data-i="' + i + '"><span>' + esc(e.region_label) + ' の ' + esc(e.treatment_label) + '</span>' +
          '<span class="d">治療日 ' + esc(e.index_date) + '</span></button>';
      });
      html += '</div>';
      render(html);
      $screen.addEventListener('click', function h(ev) {
        var b = ev.target.closest('.opt'); if (!b) return;
        $screen.removeEventListener('click', h);
        EP = list[Number(b.dataset.i)];
        resetAnswers();
        renderStep('q1');
      });
    }

    function resetAnswers() {
      A = { nrs: null, pgic: null, analgesic: null, added: [], addedOther: '', ae: [], aeOther: '',
            aeDetail: { onset: '', days: '', visited: '', treated: '', admitted: '' }, hasNote: null, note: '' };
    }

    var ORDER = ['q1', 'q2', 'q3', 'q4', 'q5', 'q5d', 'q6'];
    function stepIndex(id) { return ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'].indexOf(id === 'q5d' ? 'q5' : id) + 1; }
    function header(id) {
      if (!EP) {
        // 短縮版(エピソード未解決): 旧2問版と同じ2問。Q1 は汎用ラベル
        return '<div class="meta">経過フォロー ' + (id === 'q1' ? 1 : 2) + ' / 2</div>' +
          (id === 'q1' ? '<h1>経過をお聞かせください</h1><p class="lead">治療後の経過を確認させていただきます。ボタンを選んで進むだけです。</p>' : '');
      }
      return '<div class="meta">経過フォロー ' + stepIndex(id) + ' / 6</div>' +
        (id === 'q1' ? '<div class="intro">' + esc(EP.intro) + '</div>' : '');
    }
    function nav(id, nextLabel) {
      var i = ORDER.indexOf(id);
      var back = '';
      if (i > 0) back = '<button type="button" class="ghost" id="back">前へ</button>';
      return '<div class="nav">' + back + '<button type="button" class="primary" id="next" disabled>' + (nextLabel || '次へ') + '</button></div>';
    }
    function optsHtml(items, selected, multi, cls) {
      return '<div class="opts">' + items.map(function (o) {
        var key = o.key !== undefined ? o.key : o.value;
        var on = multi ? selected.indexOf(key) !== -1 : String(selected) === String(key);
        return '<button type="button" class="opt' + (multi ? ' multi' : '') + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" data-k="' + esc(key) + '"><span class="mark"></span><span>' + esc(o.label) + '</span></button>';
      }).join('') + '</div>';
    }
    function bindNext(id, validate, onNext) {
      var btn = document.getElementById('next');
      var back = document.getElementById('back');
      function refresh() { btn.disabled = !validate(); }
      refresh();
      $screen.addEventListener('input', refresh);
      $screen.addEventListener('click', function (ev) { if (ev.target.closest('.opt') || ev.target.closest('.scale button')) refresh(); });
      btn.onclick = function () { if (!validate()) return; onNext(); };
      if (back) back.onclick = function () { renderStep(prevStep(id)); };
    }
    function prevStep(id) {
      var i = ORDER.indexOf(id);
      if (!EP) return 'q1';
      if (id === 'q6' && !aeReported()) return 'q5';
      return ORDER[i - 1];
    }
    function nextStep(id) {
      if (!EP) return 'q6';
      if (id === 'q5') return aeReported() ? 'q5d' : 'q6';
      return ORDER[ORDER.indexOf(id) + 1];
    }
    function aeReported() { return A.ae.length > 0 && !(A.ae.length === 1 && A.ae[0] === 'none'); }
    function toggleMulti(arr, key) {
      if (key === 'none') return ['none'];
      var out = arr.filter(function (k) { return k !== 'none'; });
      var i = out.indexOf(key);
      if (i === -1) out.push(key); else out.splice(i, 1);
      return out;
    }

    function renderStep(id) {
      if (id === 'q1') {
        var q1Label = EP ? EP.q1_label : '治療した部位の痛み';
        var html = header('q1') + '<div class="q">Q1. 初回治療前に一番困っていた『' + esc(q1Label) + '』についてお聞きします。<br>初回治療前の痛みを10とすると、過去7日間の痛みはどのくらいですか？</div>' +
          '<div class="scale" id="scale"></div><div class="legend"><span>0 = 痛みなし</span><span>10 = 治療前と同じ</span></div>' +
          (EP ? '' : '<p class="hint" style="margin-top:8px;">複数の部位を治療された方は、元々いちばん痛みでお困りだった部位についてお答えください。</p>') + nav('q1');
        render(html);
        var el = document.getElementById('scale');
        for (var i = 0; i <= 10; i++) { var b = document.createElement('button'); b.type = 'button'; b.textContent = i; b.dataset.v = i; if (A.nrs === i) b.className = 'on'; el.appendChild(b); }
        var w = document.createElement('button'); w.type = 'button'; w.className = 'worse' + (A.nrs === 11 ? ' on' : ''); w.textContent = '治療前より痛い'; w.dataset.v = 11; el.appendChild(w);
        el.addEventListener('click', function (e) {
          var t = e.target.closest('button'); if (!t) return;
          A.nrs = Number(t.dataset.v);
          Array.prototype.forEach.call(el.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === t); });
        });
        bindNext('q1', function () { return A.nrs !== null; }, function () { renderStep(nextStep('q1')); });
        return;
      }
      if (id === 'q2') {
        render(header('q2') + '<div class="q">Q2. 初回治療前と比べて、治療した部位の状態は全体としてどうですか？</div>' +
          '<p class="sub">痛みだけでなく、動かしやすさや日常生活への影響も含めてお答えください。</p>' +
          optsHtml(INIT.options.pgic, A.pgic, false) + nav('q2'));
        $screen.querySelector('.opts').addEventListener('click', function (e) {
          var b = e.target.closest('.opt'); if (!b) return;
          A.pgic = Number(b.dataset.k);
          Array.prototype.forEach.call($screen.querySelectorAll('.opt'), function (x) { x.classList.toggle('on', x === b); });
        });
        bindNext('q2', function () { return A.pgic !== null; }, function () { renderStep('q3'); });
        return;
      }
      if (id === 'q3') {
        var h3 = header('q3') + '<div class="q">Q3. 過去7日間で、今回治療した痛みのために鎮痛薬を使った日は何日ありましたか？</div><div class="scale days" id="scale"></div>' +
          '<div class="legend"><span>0日</span><span>7日</span></div>' + nav('q3');
        render(h3);
        var el3 = document.getElementById('scale');
        for (var d = 0; d <= 7; d++) { var bd = document.createElement('button'); bd.type = 'button'; bd.textContent = d; bd.dataset.v = d; if (A.analgesic === d) bd.className = 'on'; el3.appendChild(bd); }
        el3.addEventListener('click', function (e) {
          var t = e.target.closest('button'); if (!t) return;
          A.analgesic = Number(t.dataset.v);
          Array.prototype.forEach.call(el3.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === t); });
        });
        bindNext('q3', function () { return A.analgesic !== null; }, function () { renderStep('q4'); });
        return;
      }
      if (id === 'q4') {
        render(header('q4') + '<div class="q">Q4. 前回の回答以降、この痛みに対して他の治療を受けましたか？(他院を含む・複数選択可)</div>' +
          optsHtml(INIT.options.added_treatments, A.added, true) +
          '<div id="otherbox" ' + (A.added.indexOf('other') === -1 ? 'hidden' : '') + '><input type="text" id="f-added-other" placeholder="その他の治療の内容" value="' + esc(A.addedOther) + '"></div>' + nav('q4'));
        $screen.querySelector('.opts').addEventListener('click', function (e) {
          var b = e.target.closest('.opt'); if (!b) return;
          A.added = toggleMulti(A.added, b.dataset.k);
          Array.prototype.forEach.call($screen.querySelectorAll('.opt'), function (x) { x.classList.toggle('on', A.added.indexOf(x.dataset.k) !== -1); });
          document.getElementById('otherbox').hidden = A.added.indexOf('other') === -1;
        });
        bindNext('q4', function () {
          A.addedOther = (document.getElementById('f-added-other').value || '').trim();
          return A.added.length > 0 && (A.added.indexOf('other') === -1 || A.addedOther !== '');
        }, function () { renderStep('q5'); });
        return;
      }
      if (id === 'q5') {
        render(header('q5') + '<div class="q">Q5. 治療後、次のような症状はありましたか？(複数選択可)</div>' +
          optsHtml(EP.ae_options, A.ae, true) +
          '<div id="otherbox" ' + (A.ae.indexOf('other') === -1 ? 'hidden' : '') + '><input type="text" id="f-ae-other" placeholder="症状の内容" value="' + esc(A.aeOther) + '"></div>' + nav('q5'));
        $screen.querySelector('.opts').addEventListener('click', function (e) {
          var b = e.target.closest('.opt'); if (!b) return;
          A.ae = toggleMulti(A.ae, b.dataset.k);
          Array.prototype.forEach.call($screen.querySelectorAll('.opt'), function (x) { x.classList.toggle('on', A.ae.indexOf(x.dataset.k) !== -1); });
          document.getElementById('otherbox').hidden = A.ae.indexOf('other') === -1;
        });
        bindNext('q5', function () {
          A.aeOther = (document.getElementById('f-ae-other').value || '').trim();
          return A.ae.length > 0 && (A.ae.indexOf('other') === -1 || A.aeOther !== '');
        }, function () { renderStep(nextStep('q5')); });
        return;
      }
      if (id === 'q5d') {
        var groups = [
          ['onset', 'その症状はいつからありましたか？'], ['days', '何日くらい続きましたか？'],
          ['visited', 'その症状で医療機関を受診しましたか？'], ['treated', 'その症状に対して治療を受けましたか？'], ['admitted', 'その症状で入院しましたか？'],
        ];
        var hd = header('q5d') + '<div class="q">Q5. 選ばれた症状についてお聞きします。</div>';
        groups.forEach(function (g) {
          hd += '<div class="group" data-g="' + g[0] + '"><div class="gq">' + esc(g[1]) + '</div>' + optsHtml(INIT.options.ae_detail[g[0]], A.aeDetail[g[0]], false) + '</div>';
        });
        render(hd + nav('q5d'));
        $screen.addEventListener('click', function (e) {
          var b = e.target.closest('.opt'); if (!b) return;
          var g = b.closest('.group'); if (!g) return;
          A.aeDetail[g.dataset.g] = b.dataset.k;
          Array.prototype.forEach.call(g.querySelectorAll('.opt'), function (x) { x.classList.toggle('on', x === b); });
        });
        bindNext('q5d', function () { return groups.every(function (g) { return A.aeDetail[g[0]] !== ''; }); }, function () { renderStep('q6'); });
        return;
      }
      if (id === 'q6') {
        var hint = MODE === 'clinic'
          ? '<p class="hint">いただいた内容は本日の診察時に医師が確認します。</p>'
          : '<p class="hint">いただいた内容は診察時に医師が確認します。お急ぎのご相談は『無料相談・お問い合わせ』からお願いします。</p>';
        render(header('q6') + '<div class="q">' + (EP ? 'Q6. ' : 'Q2. ') + '次回の診察で医師に伝えておきたいことはありますか？</div>' +
          optsHtml([{ key: 'no', label: '特にありません' }, { key: 'yes', label: 'あります' }], A.hasNote === null ? '' : (A.hasNote ? 'yes' : 'no'), false) +
          '<div id="notebox" ' + (A.hasNote ? '' : 'hidden') + '><textarea id="f-note" placeholder="まだ肩の痛みが残っている／追加治療をした方がいいか聞きたい／気をつけることを知りたい">' + esc(A.note) + '</textarea></div>' +
          hint + nav('q6', '送信する'));
        $screen.querySelector('.opts').addEventListener('click', function (e) {
          var b = e.target.closest('.opt'); if (!b) return;
          A.hasNote = b.dataset.k === 'yes';
          Array.prototype.forEach.call($screen.querySelectorAll('.opt'), function (x) { x.classList.toggle('on', x === b); });
          document.getElementById('notebox').hidden = !A.hasNote;
          if (A.hasNote) document.getElementById('f-note').focus();
        });
        bindNext('q6', function () {
          A.note = (document.getElementById('f-note').value || '').trim();
          return A.hasNote !== null && (!A.hasNote || A.note !== '');
        }, submit);
        return;
      }
    }

    // ---- 送信 ----
    function submit() {
      var btn = document.getElementById('next');
      btn.disabled = true; btn.textContent = '送信中…';
      var body = { action: 'kaifuku_submit', form_version: FORM_VERSION, nrs: A.nrs, has_note: !!A.hasNote, note: A.hasNote ? A.note : '', timing: timing, campaign: campaign };
      if (EP) {
        body.episode_id = EP.episode_id;
        body.pgic = A.pgic; body.analgesic_days_7d = A.analgesic;
        body.added_treatments = A.added.map(function (k) { return k === 'other' ? 'other:' + A.addedOther : k; });
        body.ae_flags = A.ae.map(function (k) { return k === 'other' ? 'other:' + A.aeOther : k; });
        if (aeReported()) body.ae_detail = A.aeDetail;
      }
      callApi(body).then(function (data) {
        if (data && data.ok) return renderDone();
        if (data && data.code === 'ALREADY_ANSWERED') return renderAnswered();
        throw new Error((data && data.error) || '受付できませんでした');
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = '送信する';
        fail('送信に失敗しました(' + (err && err.message ? err.message : err) + ')。');
      });
    }

    function renderDone() {
      // 同じ人に未回答のエピソードが残っていれば続けて聞く(LINE・院内共通)
      var rest = (INIT.episodes || []).filter(function (e) { return !e.answered_at && (!EP || e.episode_id !== EP.episode_id); });
      if (EP) EP.answered_at = 'now';
      if (rest.length > 0) {
        render('<div class="message">✅ ありがとうございました。<br>もう1つの治療についてもお聞かせください。</div>' +
          '<div class="nav"><button type="button" class="primary" id="next">続ける</button></div>');
        document.getElementById('next').onclick = function () { resetAnswers(); if (rest.length === 1) { EP = rest[0]; renderStep('q1'); } else { renderSelect(rest); } };
        return;
      }
      if (MODE === 'clinic') {
        // 戻る導線なし。iPadを受付に返してもらう
        render('<div class="message big">✅ ありがとうございました。<br>受付にiPadをお返しください。</div>');
        return;
      }
      render('<div class="message">✅ ありがとうございました。<br>経過を受け付けました。<br>次回の診察時に医師が確認いたします。</div>');
      closeIfLine();
    }
    function closeIfLine() {
      if (MODE === 'line' && window.liff && liff.isInClient && liff.isInClient()) {
        setTimeout(function () { liff.closeWindow(); }, 3000);
      }
    }
  </script>
</body>
</html>
